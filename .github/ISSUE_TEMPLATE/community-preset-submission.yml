name: Community preset submission
description: Submit a Pi-MFX preset manifest for automated checks and human catalog review.
title: "[Preset submission] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for sharing a Pi-MFX preset.

        Pi-MFX should have downloaded a JSON manifest before opening this form. Attach it below. GitHub validates the JSON without executing it. A maintainer must approve the generated pull request before the preset appears in the catalog.
  - type: upload
    id: manifest
    attributes:
      label: Preset manifest
      description: Attach the JSON file downloaded from Pi-MFX. Do not attach plugins, scripts, models, IRs, audio, or executable content.
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes for the reviewer
      description: Optional context about the sound, intended instrument, or required equipment.
      placeholder: Clean, crunch, high gain, bass, acoustic, or other useful details.
    validations:
      required: false
  - type: checkboxes
    id: confirmations
    attributes:
      label: Submission checks
      options:
        - label: I created this preset or have permission to share it under the license in the manifest.
          required: true
        - label: I understand that plugins, models, IR files, audio, scripts, and arbitrary download links are not included.
          required: true
        - label: I understand that this submission is public and requires human approval before publication.
          required: true
