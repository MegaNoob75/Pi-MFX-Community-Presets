name: Validate catalog

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check "jsonschema==4.23.0"
      - name: Validate catalog files
        shell: python
        run: |
          import hashlib
          import json
          import pathlib
          import re
          import sys
          from jsonschema import Draft202012Validator

          root = pathlib.Path(".")
          schema = json.loads((root / "schema/preset-package-v1.schema.json").read_text(encoding="utf-8"))
          validator = Draft202012Validator(schema)
          failures = []

          forbidden_suffixes = {
              ".exe", ".dll", ".so", ".dylib", ".sh", ".bash", ".bat", ".cmd",
              ".ps1", ".py", ".js", ".mjs", ".cjs", ".html", ".htm", ".svg",
              ".nam", ".aidax", ".wav", ".flac", ".mp3", ".lv2"
          }

          for path in (root / "presets").rglob("*") if (root / "presets").exists() else []:
              if path.is_symlink():
                  failures.append(f"{path}: symlinks are forbidden")
                  continue
              if not path.is_file():
                  continue
              if path.suffix.lower() in forbidden_suffixes:
                  failures.append(f"{path}: forbidden file type")
              if path.name not in {"manifest.json", "preview.webp", "preview.ogg"}:
                  failures.append(f"{path}: unexpected package file")
              if path.stat().st_size > 10 * 1024 * 1024:
                  failures.append(f"{path}: exceeds 10 MiB repository limit")
              if path.name == "manifest.json":
                  try:
                      data = json.loads(path.read_text(encoding="utf-8"))
                  except Exception as exc:
                      failures.append(f"{path}: invalid JSON: {exc}")
                      continue
                  for error in validator.iter_errors(data):
                      failures.append(f"{path}: {error.json_path}: {error.message}")
                  rendered = json.dumps(data, separators=(",", ":"))
                  if re.search(r"https?://", rendered, re.IGNORECASE):
                      allowed_uris = [slot.get("uri", "") for slot in data.get("preset", {}).get("chain", [])]
                      without_uris = rendered
                      for uri in allowed_uris:
                          without_uris = without_uris.replace(json.dumps(uri)[1:-1], "")
                      if re.search(r"https?://", without_uris, re.IGNORECASE):
                          failures.append(f"{path}: arbitrary URL outside trusted LV2 URI fields")

          catalog = json.loads((root / "catalog/index.json").read_text(encoding="utf-8"))
          if catalog.get("format") != "pimfx-community-catalog" or catalog.get("formatVersion") != 1:
              failures.append("catalog/index.json: unsupported catalog format")

          indexed_paths = set()
          seen_ids = set()
          for entry in catalog.get("presets", []):
              preset_id = entry.get("id", "")
              manifest_path = entry.get("manifestPath", "")
              expected_path = f"presets/{preset_id}/manifest.json"
              if not re.fullmatch(r"[a-z0-9][a-z0-9-]{2,63}", preset_id) or preset_id in seen_ids:
                  failures.append(f"catalog/index.json: invalid or duplicate id {preset_id!r}")
                  continue
              seen_ids.add(preset_id)
              if manifest_path != expected_path:
                  failures.append(f"catalog/index.json: unsafe manifest path for {preset_id}")
                  continue
              indexed_paths.add(manifest_path)
              path = root / manifest_path
              if not path.is_file() or path.is_symlink():
                  failures.append(f"{manifest_path}: indexed manifest is missing or unsafe")
                  continue
              data = json.loads(path.read_text(encoding="utf-8"))
              compact = json.dumps(data, ensure_ascii=False, separators=(",", ":"))
              actual = hashlib.sha256(compact.encode("utf-8")).hexdigest()
              if entry.get("manifestSha256") != actual:
                  failures.append(f"{manifest_path}: catalog checksum mismatch")
              if data.get("id") != preset_id:
                  failures.append(f"{manifest_path}: manifest id does not match index")

          actual_paths = {str(path.as_posix()) for path in (root / "presets").glob("*/manifest.json")}
          for unlisted in sorted(actual_paths - indexed_paths):
              failures.append(f"{unlisted}: manifest is not listed in catalog/index.json")

          if failures:
              print("\n".join(failures))
              sys.exit(1)
          print("Catalog validation passed")
